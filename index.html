<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>iOTA｜OTA 登入</title><meta name="description" content="iOTA OTA 系統登入頁面。">
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#12283e;background:#f7fafc;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}main{min-height:100svh;display:grid;grid-template-columns:1fr 1fr}.brand{background:#102e48;color:white;padding:54px 64px;display:flex;flex-direction:column;position:relative;overflow:hidden}.logo{font-size:42px;font-weight:750;letter-spacing:-2px;line-height:1.15;display:inline-block}.logo span{color:#26cfcb}.brand::after{content:"";width:650px;height:650px;position:absolute;left:48%;top:30%;border:1px solid #ffffff17;border-radius:50%;box-shadow:0 0 0 80px #ffffff03,0 0 0 160px #ffffff03;pointer-events:none}.brand-main{margin:auto 0;position:relative;z-index:1;padding:60px 0;max-width:480px}.eyebrow{color:#57dedb;letter-spacing:3px;font-size:14px;font-weight:600;margin:0 0 28px}.brand h1{font-size:clamp(42px,4.3vw,66px);letter-spacing:-2px;line-height:1.2;margin:0;font-weight:650}.brand-line{height:4px;width:54px;background:#26cfcb;margin-top:36px}.brand-footer{font-size:13px;color:#a9bdcb;z-index:1}.surface{display:flex;align-items:center;justify-content:center;padding:64px 40px;background:#fff}.login{width:100%;max-width:390px}.mobile-logo{display:none;margin-bottom:52px}.section-label{font-size:14px;font-weight:650;letter-spacing:2px;color:#507080;margin:0 0 16px}.login h2{font-size:32px;letter-spacing:-.8px;margin:0 0 12px}.intro{font-size:16px;line-height:1.6;color:#6b7a89;margin:0 0 38px}label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}.field{margin-bottom:24px}.input-wrap{position:relative}input{width:100%;height:54px;border:1px solid #d7e0e7;border-radius:10px;background:#fff;padding:0 16px;color:#12283e;outline:none;font-size:16px;transition:box-shadow .2s,border-color .2s}input::placeholder{color:#8b98a5}input:focus{border-color:#087d89;box-shadow:0 0 0 3px #087d8914}#password{padding-right:56px}.eye{position:absolute;right:8px;top:7px;width:40px;height:40px;border:none;background:transparent;border-radius:7px;color:#687d8d;display:grid;place-items:center}.eye:hover{background:#eff5f7}.eye svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7}.submit{width:100%;height:54px;background:#123c59;color:white;border:0;border-radius:10px;font-weight:650;letter-spacing:2px;transition:background .2s;margin-top:8px}.submit:hover{background:#075e70}.submit:disabled{opacity:.65;cursor:wait}button:focus-visible{outline:3px solid #26aaa8;outline-offset:4px}.error{font-size:14px;color:#be3542;line-height:1.5;min-height:21px;margin:12px 0 0}.legal{border-top:1px solid #e8eef2;padding-top:24px;margin-top:26px;font-size:13px;color:#8795a1;letter-spacing:.3px}.success{padding:20px 0}.success-icon{height:64px;width:64px;display:grid;place-items:center;border-radius:50%;background:#e5f6f4;color:#137972;font-size:32px;margin-bottom:28px}.success p{color:#6b7a89;line-height:1.7}.account{padding:16px;background:#f5f8fa;border-radius:10px;font-size:14px;margin:28px 0}.account strong{display:block;margin-top:8px;color:#173f58}[hidden]{display:none!important}@media(min-width:1500px){.brand{padding:64px 90px}.surface{padding:80px}}@media(max-width:760px){main{grid-template-columns:1fr}.brand{display:none}.surface{min-height:100svh;padding:42px 28px}.mobile-logo{display:block;font-size:38px}.login h2{font-size:30px}.intro{margin-bottom:32px}.legal{margin-top:32px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body><main><aside class="brand" aria-label="iOTA 品牌"><div class="logo"><span>i</span>OTA</div><div class="brand-main"><p class="eyebrow">OTA MANAGEMENT</p><h1>一個入口。<br>連接每次更新。</h1><div class="brand-line"></div></div><div class="brand-footer">© 2026 iOTA. All rights reserved.</div></aside><section class="surface"><div class="login"><div class="logo mobile-logo"><span>i</span>OTA</div><div id="loginView"><p class="section-label">WELCOME TO iOTA</p><h2>登入 OTA 系統</h2><p class="intro">歡迎回來，請輸入您的帳號與密碼。</p><form id="loginForm"><div class="field"><label for="username">帳號</label><input id="username" name="username" autocomplete="username" placeholder="請輸入帳號" required autocapitalize="none" spellcheck="false"></div><div class="field"><label for="password">密碼</label><div class="input-wrap"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="請輸入密碼" required><button type="button" class="eye" id="togglePassword" aria-label="顯示密碼" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div><button class="submit" id="submitButton" type="submit">登入</button><p id="error" class="error" role="alert"></p></form></div><div id="successView" class="success" hidden><div class="success-icon" aria-hidden="true">✓</div><p class="section-label">WELCOME TO iOTA</p><h2 tabindex="-1" id="successTitle">登入成功</h2><p>歡迎使用 iOTA OTA 系統。</p><div class="account">目前登入帳號<strong id="loggedAccount"></strong></div><button type="button" class="submit" id="logout">登出</button></div><div class="legal">iOTA · OTA Management System</div></div></section></main>
<script>
// 展示用登入驗證；正式產品請改由伺服器驗證帳密。
const DEMO_ACCOUNT = {username:'iota.admin',password:'iOTA@2026!'};
const form=document.getElementById('loginForm'),password=document.getElementById('password'),toggle=document.getElementById('togglePassword'),error=document.getElementById('error');
toggle.addEventListener('click',()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.setAttribute('aria-label',visible?'隱藏密碼':'顯示密碼');toggle.setAttribute('aria-pressed',String(visible));});
form.addEventListener('input',()=>{error.textContent='';});
form.addEventListener('submit',event=>{event.preventDefault();const username=document.getElementById('username').value.trim();if(username!==DEMO_ACCOUNT.username||password.value!==DEMO_ACCOUNT.password){error.textContent='帳號或密碼不正確，請重新輸入。';return;}window.location.assign('https://uiuxjads-alt.github.io/do/cs/ja.html');});
document.getElementById('logout').addEventListener('click',()=>{document.getElementById('successView').hidden=true;document.getElementById('loginView').hidden=false;form.reset();error.textContent='';password.type='password';toggle.setAttribute('aria-label','顯示密碼');toggle.setAttribute('aria-pressed','false');document.getElementById('username').focus();});
</script></body></html>
